server:
  host: 0.0.0.0
  port: 8080
  jsonBodyLimit: 1mb

app:
  name: forum-backend-js
  profile: dev
  api:
    prefix: /api/v1
  cors:
    enabled: true
    credentials: true
    origins:
      - http://localhost:3000
      - http://localhost:5173
  database:
    host: 127.0.0.1
    port: 3306
    user: root
    password: ''
    database: forum
    connectionLimit: 10
  uploads:
    dir: ./data/uploads
    publicPath: /uploads
    maxFileSizeMb: 5
  pagination:
    defaultSize: 10
    allowedSizes:
      - 10
      - 20
      - 30
  auth:
    issueTokenOnRegister: false
    identifierCaseInsensitive: true
    usernamePattern: '^[A-Za-z0-9]+$'
    passwordPolicy:
      minLength: 8
      requireUppercase: true
      requireSpecialCharacter: true
  security:
    jwt:
      secret: change-me-in-production
      issuer: forum-backend-js
      audience: forum-frontend
      expiresIn: 1h
  mail:
    enabled: false
    from: no-reply@example.com
    sendWelcomeEmail: false
    welcome:
      subject: Welcome to the platform
      text: Hello {{username}}, your account has been created successfully.
    transport:
      host: smtp.example.com
      port: 587
      secure: false
      auth:
        user: smtp-user
        pass: smtp-password

logging:
  level: info
  logRequests: true

