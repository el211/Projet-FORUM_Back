services:
  mysql:
    image: mysql:8.4
    container_name: forum-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: forum
    ports:
      # Host 3307 -> container 3306 (3306 may be taken by another local DB).
      - "3307:3306"
    volumes:
      - forum-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  forum-mysql-data:
